<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ 反应力测试 · 全年龄标准</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(145deg, #1a2634 0%, #0e1219 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 16px;
      margin: 0;
    }

    .card {
      background: rgba(22, 28, 36, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 32px 24px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    h1 {
      text-align: center;
      font-weight: 600;
      font-size: 2.2rem;
      color: #ffffff;
      text-shadow: 0 4px 10px rgba(0, 180, 255, 0.3);
      margin-bottom: 16px;
    }

    .sub {
      text-align: center;
      color: #9aa8b9;
      margin-bottom: 30px;
      border-bottom: 1px dashed #2f3a48;
      padding-bottom: 18px;
    }

    .test-area {
      background-color: #2f3a48;
      border-radius: 40px;
      padding: 40px 20px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.05s ease;
      box-shadow: 0 18px 25px -10px rgba(0, 0, 0, 0.7), inset 0 -2px 0 rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 28px;
      font-weight: 600;
      font-size: 2rem;
      color: white;
      word-break: break-word;
      touch-action: manipulation;
    }

    .stats {
      background: #1e2630;
      border-radius: 40px;
      padding: 24px 20px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-label {
      color: #b0c4de;
      font-size: 1.2rem;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 700;
      background: #0b1119;
      padding: 8px 22px;
      border-radius: 60px;
      color: #d4edff;
      box-shadow: inset 0 2px 5px #00000055;
      font-variant-numeric: tabular-nums;
    }

    .level-display {
      background: #131b24;
      border-radius: 60px;
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.3rem;
      border: 1px solid #3d4c5e;
    }

    .level-label {
      color: #d2e5ff;
    }

    #level {
      font-weight: 700;
      color: #ffd966;
      background: #1f2b36;
      padding: 6px 20px;
      border-radius: 50px;
      font-size: 1.5rem;
    }

    .button-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin: 20px 0 18px;
    }

    .btn {
      background: #28313b;
      border: none;
      border-radius: 60px;
      padding: 16px 32px;
      font-size: 1.3rem;
      font-weight: 600;
      color: #eef5ff;
      cursor: pointer;
      transition: all 0.15s;
      flex: 1;
      max-width: 200px;
      box-shadow: 0 8px 0 #0f141b;
      border: 1px solid #405770;
      touch-action: manipulation;
    }

    .btn:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #0f141b;
    }

    /* 标准信息框公用样式 */
    .info-norms {
      background: #1b232e;
      border-radius: 32px;
      padding: 20px 18px;
      color: #bdc9d9;
      border-left: 5px solid #4f9fdb;
    }

    .info-norms h3 {
      color: white;
      font-weight: 400;
      margin-bottom: 12px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .norms-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      justify-content: space-between;
    }

    .norm-item {
      background: #2a3643;
      padding: 4px 14px;
      border-radius: 50px;
      font-weight: 400;
      color: #d0e2ff;
    }

    .norm-item strong {
      color: #ffe484;
      margin-right: 4px;
    }

    .minor-note {
      margin-top: 10px;
      font-size: 0.9rem;
      font-style: italic;
      color: #9bb5d4;
      border-top: 1px dashed #3f5068;
      padding-top: 10px;
    }

    #error-message {
      color: #ffa07a;
      background: #2d1e1e;
      border-radius: 30px;
      padding: 10px 16px;
      margin-top: 16px;
      font-size: 0.9rem;
      border: 1px solid #ff6b6b;
      display: none;
      word-break: break-word;
    }

    footer {
      text-align: center;
      color: #5f748b;
      margin-top: 24px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ 反应速度</h1>
    <div class="sub">点击下方区域 · 变绿瞬间点击</div>

    <!-- 可点击测试区 -->
    <div class="test-area" id="testArea" role="button" tabindex="0">
      点击开始测试
    </div>

    <!-- 实时结果 -->
    <div class="stats">
      <div class="stat-row">
        <span class="stat-label">反应时间</span>
        <span class="stat-value" id="reactionTime">—</span>
      </div>
      <div class="level-display">
        <span class="level-label">反应力水平</span>
        <span id="level">—</span>
      </div>
    </div>

    <!-- 控制按钮 -->
    <div class="button-group">
      <button class="btn" id="resetBtn">🔄 重测</button>
    </div>

    <!-- 成人参考标准 (原有) -->
    <div class="info-norms">
      <h3>📊 参考标准 · 成人平均</h3>
      <div class="norms-grid">
        <span class="norm-item"><strong>＜150ms</strong> 极快</span>
        <span class="norm-item"><strong>150–200ms</strong> 优秀</span>
        <span class="norm-item"><strong>200–250ms</strong> 平均</span>
        <span class="norm-item"><strong>250–300ms</strong> 较慢</span>
        <span class="norm-item"><strong>＞300ms</strong> 待加强</span>
      </div>
    </div>

    <!-- 新增：未成年人参考标准 (6-12岁) -->
    <div class="info-norms" style="margin-top: 18px; border-left-color: #ffb347;">
      <h3>🧒 未成年人参考 · 6-12岁</h3>
      <div class="norms-grid">
        <span class="norm-item"><strong>＜200ms</strong> 极快</span>
        <span class="norm-item"><strong>200–250ms</strong> 优秀</span>
        <span class="norm-item"><strong>250–300ms</strong> 平均</span>
        <span class="norm-item"><strong>300–350ms</strong> 较慢</span>
        <span class="norm-item"><strong>＞350ms</strong> 待加强</span>
      </div>
      <div class="minor-note">
        💡 13-17岁青少年反应力逐渐接近成人标准，可同时参考成人栏。
      </div>
    </div>

    <!-- 错误提示区域（保留） -->
    <div id="error-message"></div>

    <footer>单击区域 · 等待随机时间 · 抢跑/超时会重置</footer>
  </div>

  <script>
    (function() {
      // 错误显示
      const errorDiv = document.getElementById('error-message');
      function showError(msg) {
        if (errorDiv) {
          errorDiv.style.display = 'block';
          errorDiv.innerText = '⚠️ ' + msg;
        }
        console.error(msg);
      }

      // 高精度时间函数
      const now = (performance && performance.now) ? () => performance.now() : () => Date.now();

      // DOM 元素
      const testArea = document.getElementById('testArea');
      const reactionSpan = document.getElementById('reactionTime');
      const levelSpan = document.getElementById('level');
      const resetBtn = document.getElementById('resetBtn');

      if (!testArea || !reactionSpan || !levelSpan || !resetBtn) {
        showError('页面元素缺失，请刷新');
        return;
      }

      // 状态变量
      let state = 'idle';           // idle, waiting, ready, result
      let readyTime = 0;
      let waitTimer = null;         // 等待变绿的主定时器
      let reactTimer = null;        // 变绿后超时定时器
      let waitGuardTimer = null;    // 等待阶段保护定时器 (5秒强制重置)

      // 清除所有定时器
      function clearAllTimers() {
        if (waitTimer) {
          clearTimeout(waitTimer);
          waitTimer = null;
        }
        if (reactTimer) {
          clearTimeout(reactTimer);
          reactTimer = null;
        }
        if (waitGuardTimer) {
          clearTimeout(waitGuardTimer);
          waitGuardTimer = null;
        }
      }

      // 更新测试区UI
      function setArea(text, bgColor) {
        testArea.innerText = text;
        testArea.style.backgroundColor = bgColor;
      }

      // 重置到空闲 (清空统计可选)
      function resetToIdle(message = '点击开始测试', clearStats = true) {
        clearAllTimers();
        state = 'idle';
        setArea(message, '#2f3a48');
        if (clearStats) {
          reactionSpan.innerText = '—';
          levelSpan.innerText = '—';
        }
      }

      // 根据时间获取等级 (成人标准，这里仅作显示，未成年人可自己对照参考栏)
      function getLevel(ms) {
        if (ms < 150) return '极快 ⚡';
        if (ms < 200) return '优秀 🔥';
        if (ms < 250) return '平均 👌';
        if (ms < 300) return '较慢 🐢';
        return '待加强 💤';
      }

      // 开始测试 (idle -> waiting)
      function startTest() {
        if (state !== 'idle') return;

        clearAllTimers();
        state = 'waiting';
        setArea('等待绿色...', '#5f6b7a');

        // 随机延迟 1.2~3.2 秒
        const delay = Math.random() * 2000 + 1200;

        // 主定时器：变绿
        waitTimer = setTimeout(() => {
          if (state !== 'waiting') return;
          waitTimer = null;

          // 进入 ready
          state = 'ready';
          readyTime = now();
          setArea('👉 立刻点击！', '#2e7d5e');

          // 反应超时 (2秒未点击则重置)
          reactTimer = setTimeout(() => {
            if (state === 'ready') {
              resetToIdle('⏳ 超时，重试', true);
            }
            reactTimer = null;
          }, 2000);
        }, delay);

        // 保护定时器：5秒后如果还在waiting，强制重置（防止意外卡死）
        waitGuardTimer = setTimeout(() => {
          if (state === 'waiting') {
            showError('等待超时保护触发');
            resetToIdle('⌛ 等待异常，重试', true);
          }
          waitGuardTimer = null;
        }, 5000);
      }

      // 核心点击处理
      function handleClick(e) {
        try {
          if (state === 'idle') {
            startTest();
            return;
          }

          if (state === 'waiting') {
            // 抢跑
            resetToIdle('❌ 抢跑了！再试一次', true);
            return;
          }

          if (state === 'ready') {
            const reactionMs = now() - readyTime;

            // 过滤极快异常（<20ms 多半是误触或双击）
            if (reactionMs < 20) {
              resetToIdle('🔄 太快了，重试', true);
              return;
            }

            // 清除反应超时定时器
            if (reactTimer) {
              clearTimeout(reactTimer);
              reactTimer = null;
            }

            const rounded = Math.round(reactionMs);
            reactionSpan.innerText = `${rounded} ms`;
            levelSpan.innerText = getLevel(rounded);

            state = 'result';
            setArea('✓ 点击区域可再测', '#1e5f8e');

            // 清理保护定时器
            if (waitGuardTimer) {
              clearTimeout(waitGuardTimer);
              waitGuardTimer = null;
            }
            return;
          }

          if (state === 'result') {
            // 结果界面点击：直接开始新一轮
            resetToIdle('', true);
            startTest();
            return;
          }
        } catch (err) {
          showError('点击处理: ' + err.message);
        }
      }

      // 绑定事件
      testArea.addEventListener('click', handleClick);

      // 键盘支持
      testArea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleClick(e);
        }
      });

      // 重置按钮
      resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        resetToIdle('点击开始测试', true);
      });

      // 初始化
      resetToIdle('点击开始测试', true);
    })();
  </script>
</body>
</html>
